<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block titre %}Carnet de contacts{% endblock %}</title>
   <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
        margin: 0;
        padding: 0;
        min-height: 100vh;
    }

    header {
        background-color: rgba(0, 0, 0, 0.2);
        color: white;
        padding: 25px 20px;
        text-align: center;
    }

    header h1 {
        margin: 0 0 10px 0;
        font-size: 2em;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin: 0 10px;
        font-weight: 600;
        opacity: 0.9;
    }

    nav a:hover {
        opacity: 1;
        text-decoration: underline;
    }

    main {
        max-width: 800px;
        margin: 40px auto;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h2 {
        color: #764ba2;
        border-bottom: 3px solid #764ba2;
        padding-bottom: 10px;
        margin-top: 0;
    }

    ul {
        list-style: none;
        padding: 0;
        margin: 20px 0 0 0;
    }

    ul li {
        padding: 15px;
        margin-bottom: 8px;
        background: #f8f7fc;
        border-radius: 8px;
        border-left: 4px solid #764ba2;
        transition: transform 0.15s, box-shadow 0.15s;
    }

    ul li:hover {
        transform: translateX(5px);
        box-shadow: 0 4px 12px rgba(118, 75, 162, 0.15);
    }

    ul li a {
        color: #4a2f6b;
        text-decoration: none;
        font-weight: bold;
        font-size: 1.05em;
    }

    ul li a:hover {
        color: #764ba2;
    }

    /* Détail contact */
    .detail-info {
        list-style: none;
        padding: 0;
    }

    .detail-info li {
        padding: 12px 15px;
        margin-bottom: 8px;
        background: #f8f7fc;
        border-radius: 8px;
        border-left: none;
    }

    /* Bouton retour */
    .btn-retour {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #764ba2;
        color: white !important;
        text-decoration: none !important;
        border-radius: 6px;
        font-weight: 600;
        transition: background-color 0.15s;
    }

    .btn-retour:hover {
        background-color: #5e3a85;
    }
</style>
</head>
<body>
    <header>
        <h1>📇 Carnet de contacts</h1>
        <nav>
            <a href="{% url 'liste_contacts' %}">Accueil</a>
        </nav>
        <hr>
    </header>

    <main>
        {% block contenu %}
        {% endblock %}
    </main>
</body>
</html>
