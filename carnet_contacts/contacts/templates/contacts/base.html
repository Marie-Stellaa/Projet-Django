<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block titre %}Carnet de contacts{% endblock %}</title>
   <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
        margin: 0;
        padding: 0;
        min-height: 100vh;
    }

    header {
        background-color: rgba(0, 0, 0, 0.2);
        color: white;
        padding: 25px 20px;
        text-align: center;
    }

    header h1 {
        margin: 0 0 10px 0;
        font-size: 2em;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin: 0 10px;
        font-weight: 600;
        opacity: 0.9;
    }

    nav a:hover {
        opacity: 1;
        text-decoration: underline;
    }

    main {
        max-width: 800px;
        margin: 40px auto;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h2 {
        color: #764ba2;
        border-bottom: 3px solid #764ba2;
        padding-bottom: 10px;
        margin-top: 0;
    }

    ul {
        list-style: none;
        padding: 0;
        margin: 20px 0 0 0;
    }

    ul li {
        padding: 15px;
        margin-bottom: 8px;
        background: #f8f7fc;
        border-radius: 8px;
        border-left: 4px solid #764ba2;
        transition: transform 0.15s, box-shadow 0.15s;
    }

    ul li:hover {
        transform: translateX(5px);
        box-shadow: 0 4px 12px rgba(118, 75, 162, 0.15);
    }

    ul li a {
        color: #4a2f6b;
        text-decoration: none;
        font-weight: bold;
        font-size: 1.05em;
    }

    ul li a:hover {
        color: #764ba2;
    }

    /* Détail contact */
    .detail-info {
        list-style: none;
        padding: 0;
    }

    .detail-info li {
        padding: 12px 15px;
        margin-bottom: 8px;
        background: #f8f7fc;
        border-radius: 8px;
        border-left: none;
    }

    /* Bouton retour */
    .btn-retour {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #764ba2;
        color: white !important;
        text-decoration: none !important;
        border-radius: 6px;
        font-weight: 600;
        transition: background-color 0.15s;
    }

    .btn-retour:hover {
        background-color: #5e3a85;
    }

        .form-contact fieldset {
    border: none;
    padding: 0;
    margin: 0;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    color: #4a2f6b;
}

.form-group input[type="text"],
.form-group input[type="email"],
.form-group input[type="tel"],
.form-group input[type="file"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 1em;
    font-family: inherit;
    transition: border-color 0.15s;
}

.form-group input:focus {
    outline: none;
    border-color: #764ba2;
    box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15);
}

.erreur {
    color: #c0392b;
    font-size: 0.9em;
    margin: 5px 0 0 0;
}

input[type="submit"] {
    border: none;
    cursor: pointer;
    font-size: 1em;
    margin-top: 10px;
}
.confirmation-box {
    background: #fdf2f2;
    border-left: 4px solid #c0392b;
    padding: 18px 20px;
    border-radius: 8px;
    margin-bottom: 25px;
}

.confirmation-box p {
    margin: 0;
    font-size: 1.05em;
}

.actions-confirmation {
    display: flex;
    gap: 12px;
    align-items: center;
}

.actions-confirmation form {
    margin: 0;
}
   
</style>
</head>
<body>
<hr>
    <header>
        <h1>📇 Carnet de contacts</h1>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="{% url 'liste_contacts' %}">Mon Répertoire</a>
        <ul class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
                <li class="nav-item">
                    <span class="nav-link">Bonjour, {{ user.username }}</span>
                </li>
                <li class="nav-item">
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link">Se déconnecter</button>
                    </form>
                </li>
            {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'login' %}">Se connecter</a>
                </li>
            {% endif %}
        </ul>
    </div>
</nav>
        <hr>
    </header>

    <main>
        {% block contenu %}
        {% endblock %}
    </main>
</body>
</html>
