<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block titre %}Carnet de contacts{% endblock %}</title>
     <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        ul li {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        ul li a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: bold;
        }

        ul li a:hover {
            color: #2980b9;
        }

        a {
            color: #2980b9;
        }
    </style>
</head>
<body>
    <header>
        <h1>📇 Carnet de contacts</h1>
        <nav>
            <a href="{% url 'liste_contacts' %}">Accueil</a>
        </nav>
        <hr>
    </header>

    <main>
        {% block contenu %}
        {% endblock %}
    </main>
</body>
</html>
