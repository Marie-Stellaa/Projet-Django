{% extends 'contacts/base.html' %}

{% block titre %}Connexion{% endblock %}

{% block contenu %}
<h2>Connexion</h2>

{% if form.errors %}
    <p class="erreur">Identifiants incorrects. Veuillez réessayer.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label for="id_username">Nom d'utilisateur</label>
        {{ form.username }}
    </div>
    <div class="form-group">
        <label for="id_password">Mot de passe</label>
        {{ form.password }}
    </div>
    <input type="submit" value="Se connecter" class="btn-retour">
</form>
{% endblock %}
