{% extends 'contacts/base.html' %}
{% block titre %}Supprimer un contact{% endblock %}
{% block contenu %}
<h2>Confirmer la suppression</h2>

<div class="confirmation-box">
    <p>Voulez-vous vraiment supprimer <strong>{{ contact.prenom }} {{ contact.nom }}</strong> ? Cette action est irréversible.</p>
</div>

<div class="actions-confirmation">
    <form action="{% url 'supprimer_contact' contact.id %}" method="post">
        {% csrf_token %}
        <input type="submit" value="Oui, supprimer" class="btn-retour" style="background-color:#c0392b;">
    </form>
    <a href="{% url 'detail_contact' contact.id %}" class="btn-retour" style="background-color:#999;">← Annuler</a>
</div>
{% endblock %}
